      - name: Bangun APK
        working-directory: sbprint-android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Beri nama file
        run: cp sbprint-android/app/build/outputs/apk/release/app-release.apk SBPrint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SBPrint-apk
          path: SBPrint.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SB Print versi 1.0.${{ github.run_number }}
          files: SBPrint.apk
          make_latest: true
          body: |
            Unduh **SBPrint.apk** di bawah, buka di HP Android, lalu pasang.
            Kalau HP meminta, izinkan "Instal dari sumber tidak dikenal" untuk browser/aplikasi file.
            Versi baru bisa langsung dipasang menimpa versi lama (pengaturan printer tetap tersimpan).
