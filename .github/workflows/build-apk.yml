# SB Print — aplikasi Android pendamping SB Sejahtera (cara kerja seperti RawBT).
# Kode aplikasi ada di folder android/, halaman SB Print (sama dengan sbsqu.com/print) di web/print/.
# Setiap perubahan di kedua folder itu otomatis membangun APK baru dan menaruhnya di "Releases".
# Link unduh tetap (selalu versi terbaru):
#   https://github.com/global5758-prog/SBS-PRINT/releases/latest/download/SBPrint.apk
name: Build SB Print APK

on:
  push:
    paths:
      - 'android/**'
      - 'web/print/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Salin halaman SB Print ke dalam aplikasi
        run: |
          mkdir -p android/app/src/main/assets/print
          cp web/print/index.html android/app/src/main/assets/print/index.html

      - name: Bangun APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Beri nama file
        run: cp android/app/build/outputs/apk/release/app-release.apk SBPrint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SBPrint-apk
          path: SBPrint.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SB Print versi 1.0.${{ github.run_number }}
          files: SBPrint.apk
          make_latest: true
          body: |
            Unduh **SBPrint.apk** di bawah, buka di HP Android, lalu pasang.
            Kalau HP meminta, izinkan "Instal dari sumber tidak dikenal" untuk browser/aplikasi file.
            Versi baru bisa langsung dipasang menimpa versi lama (pengaturan printer tetap tersimpan).
